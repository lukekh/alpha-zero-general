[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-zero-general"
version = "0.1.0"
description = "CPU-oriented AlphaZero training and playable Intransitive opponents"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Match the measured training environment. uv.lock records the full resolution.
dependencies = [
    "colorama==0.4.6",
    "coloredlogs==15.0.1",
    "filelock==3.32.6",
    "flatbuffers==25.12.19",
    "fsspec==2026.7.0",
    "humanfriendly==10.0",
    "Jinja2==3.1.6",
    "llvmlite==0.49.0",
    "MarkupSafe==3.0.3",
    "ml_dtypes==0.6.0",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numba==0.67.0",
    "numpy==2.4.6",
    "onnx==1.22.0",
    "onnxruntime==1.30.0",
    "packaging==26.3",
    "pillow==12.3.0",
    "protobuf==7.36.1",
    "scipy==1.17.1",
    "sympy==1.14.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm==4.70.1",
    "typing_extensions==4.16.0",
    # Training reports invoke python -m pip freeze.
    "pip>=24.3,<27",
]

[project.scripts]
intransitive = "intransitive.play:main"
intransitive-analyze = "intransitive.heuristics.analyze:main"

[tool.setuptools]
py-modules = [
    "Arena", "Coach", "Game", "GameSwitcher", "GenericNNetWrapper", "MCTS",
    "NeuralNet", "main", "pit", "source_backup", "utils",
]

[tool.setuptools.packages.find]
include = ["intransitive*"]
namespaces = false

[tool.setuptools.package-data]
intransitive = [
    "models/*.npz", "models/*.md", "models/*LICENSE*",
    "play.html", "heuristics/*.json", "heuristics/configs/*.json", "smoke/requirements.txt",
    "benchmarks/training/baseline.json", "benchmarks/symmetry/*.json",
    "benchmarks/teacher/*.json",
    "benchmarks/process/fixture.pt", "benchmarks/process/fixture.json",
]
